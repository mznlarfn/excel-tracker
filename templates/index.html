<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tracker No Lot - Finishing Department</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; color: #1e293b; padding: 30px 16px; line-height: 1.5; }
        .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .header { text-align: center; padding: 5px 0; }
        .header h1 { font-size: 26px; font-weight: 800; color: #003399; letter-spacing: -0.5px; line-height: 1.2; text-transform: uppercase; margin-bottom: 6px; }
        .header p { color: #64748b; font-size: 14px; font-weight: 500; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 4px; }
        
        .stat-card { background: #ffffff; border-radius: 14px; padding: 14px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -5px rgba(0,0,0,0.02); transition: all 0.2s; }
        .clickable-card { cursor: pointer; position: relative; }
        .clickable-card:hover { transform: translateY(-3px); border-color: #003399; box-shadow: 0 6px 16px rgba(0, 51, 153, 0.05); }
        .clickable-card::after { content: '▼'; font-size: 8px; color: #94a3b8; position: absolute; bottom: 4px; right: 50%; transform: translateX(50%); opacity: 0.7; }
        
        .stat-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-value { font-size: 21px; font-weight: 800; color: #0f172a; }
        .stat-month-tag { font-size: 10px; font-weight: 700; color: #003399; margin-top: 2px; text-transform: uppercase; display: block; }
        
        .card-overdue .stat-label { color: #df1c1c; }
        .card-overdue .stat-value { color: #dc2626; }
        .card-fgh .stat-label { color: #16a34a; }
        .card-fgh .stat-value { color: #16a34a; }
        .card-fgh .stat-month-tag { color: #16a34a; }

                .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; backdrop-filter: blur(2px); }
        .modal-card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes modalPop { from { transform: scale(0.9) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .modal-title { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .month-selector-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .btn-month-node { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 0; font-size: 13.5px; font-weight: 700; color: #334155; cursor: pointer; transition: all 0.15s; text-align: center; }
        .btn-month-node:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .btn-month-node.active { background: #003399; color: #ffffff; border-color: #003399; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-modal-close { background: #e2e8f0; color: #475569; border: none; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; }
        
        .card-search { background: #ffffff; border-radius: 18px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0, 51, 153, 0.04); border: 1px solid #e2e8f0; }
        .search-group { display: flex; gap: 12px; position: relative; }
        .input-wrapper { flex-grow: 1; position: relative; }
        .input-wrapper input { width: 100%; padding: 15px 44px 15px 44px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 15px; background: #f8fafc; font-weight: 500; transition: all 0.2s; -webkit-appearance: none; appearance: none; }
        .input-wrapper input:focus { outline: none; border-color: #003399; background: #fff; box-shadow: 0 0 0 4px rgba(0, 51, 153, 0.1); }
        .input-wrapper .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94a3b8; }
        .clear-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94a3b8; cursor: pointer; display: none; }
        
        .btn-search { background: #003399; color: #fff; border: none; padding: 0 28px; font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-search:hover { background: #002277; }
        .status-area { margin-top: 12px; font-size: 13.5px; font-weight: 600; display: none; }
        .alert-overdue-inline { background: #fff1f2; border: 1px solid #fecdd3; border-top: 4px solid #e11d48; color: #9f1239; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 14px; display: none; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .alert-overdue-inline svg { width: 16px; height: 16px; color: #e11d48; }
        .alert-despatch { background: #f0fdf4; border: 1px solid #bbf7d0; border-top: 4px solid #16a34a; color: #166534; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 15px; text-align: center; letter-spacing: 1px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); display: none; }

        .timeline-container { background: #ffffff; border-radius: 20px; padding: 28px 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); display: none; position: relative; }
        .timeline-list { position: relative; list-style: none; padding-left: 0; }
        .timeline-list.has-data::before { content: ''; position: absolute; left: calc(120px + 21px); top: 15px; height: calc(100% - 30px); width: 2px; background: #cbd5e1; z-index: 1; }
        
        .timeline-item { display: flex; margin-bottom: 24px; position: relative; width: 100%; }
        .timeline-item:last-child { margin-bottom: 0; }
        
        .timeline-time { width: 120px; text-align: right; font-size: 13px; color: #64748b; font-weight: 500; padding-top: 2px; padding-right: 15px; flex-shrink: 0; }
        .timeline-time .date-bold { font-size: 13.5px; color: #1e293b; font-weight: 700; margin-bottom: 1px; }
        
        .timeline-badge-wrapper { width: 42px; display: flex; justify-content: center; position: relative; flex-shrink: 0; }
        .timeline-badge { width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: 3px solid #94a3b8; z-index: 2; margin-top: 4px; box-shadow: 0 0 0 4px #ffffff; }
        
        .timeline-item.is-fgh .timeline-badge { width: 22px; height: 22px; background: #16a34a; border: 3px solid #ffffff; box-shadow: 0 0 0 3px #16a34a; margin-top: 1px; display: flex; align-items: center; justify-content: center; z-index: 3; }
        .timeline-item.is-fgh .timeline-badge::after { content: '✓'; color: #ffffff; font-size: 11px; font-weight: 900; }
        
        .timeline-content { flex-grow: 1; padding-left: 10px; padding-top: 1px; min-width: 0; }
        .timeline-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .timeline-meta { font-size: 12.5px; color: #64748b; font-weight: 500; display: flex; flex-direction: column; gap: 3px; background: #f8fafc; padding: 10px 14px; border-radius: 10px; border: 1px solid #f1f5f9; margin-top: 4px; }
        .timeline-meta div { display: flex; justify-content: space-between; border-bottom: 1px dashed #f1f5f9; padding-bottom: 2px; }
        .timeline-meta div:last-child { border-bottom: none; padding-bottom: 0; }
        .timeline-meta span.meta-label { color: #64748b; font-weight: 600; }
        .timeline-meta span.meta-val { color: #1e293b; font-weight: 700; text-align: right; }
        
        .badge-sheet { background: #e2e8f0; color: #334155; padding: 1px 6px; border-radius: 4px; font-size: 11.5px; font-weight: 700; }
        .badge-keterangan-n { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase; }
        .font-mono { font-family: monospace; font-size: 13px; color: #0f172a; font-weight: 700; }
        
        .btn-action-view { background: #ffffff; color: #003399; border: 1.5px solid #dbeafe; font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; margin-top: 8px; width: 100%; justify-content: center; box-shadow: 0 2px 4px rgba(0, 51, 153, 0.02); }
        .btn-action-view:hover { background: #f0f4ff; border-color: #003399; }
        .btn-action-view svg { width: 14px; height: 14px; }
        
        .shimmer-line { height: 14px; background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 4px; margin-bottom: 6px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        @media (max-width: 640px) {
            body { padding: 16px 8px; }
            .header h1 { font-size: 20px; }
            .stats-grid { gap: 8px; }
            .stat-card { padding: 10px 4px; }
            .stat-label { font-size: 9px; }
            .stat-value { font-size: 17px; }
            .stat-month-tag { font-size: 8.5px; }
            .search-group { flex-direction: column; gap: 10px; }
            .btn-search { width: 100%; padding: 14px 0; font-size: 15px; }
            .timeline-container { padding: 20px 10px; }
            .timeline-list.has-data::before { left: calc(75px + 12px); }
            .timeline-time { width: 75px; text-align: left; font-size: 11px; padding-right: 5px; }
            .timeline-time .date-bold { font-size: 11.5px; }
            .timeline-badge-wrapper { width: 24px; }
            .timeline-content { padding-left: 4px; }
            .timeline-title { font-size: 13.5px; gap: 6px; }
            .timeline-meta { padding: 8px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tracker No Lot Departmen Finishing</h1>
            <p>Cari dan lacak order berdasarkan Nomor Lot secara instan.</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card clickable-card" onclick="bukaModalFilter()">
                <div class="stat-label">📦 Total Order</div>
                <div id="statTotalOrder" class="stat-value">...</div>
                <span id="tagBulanOrder" class="stat-month-tag">-</span>
            </div>
            <div class="stat-card card-overdue">
                <div class="stat-label">⏱️ Lot Overdue</div>
                <div id="statTotalOverdue" class="stat-value">...</div>
                <span class="stat-month-tag" style="color: #df1c1c;">GLOBAL REALTIME</span>
            </div>
            <div class="stat-card card-fgh clickable-card" onclick="bukaModalFilter()">
                <div class="stat-label">🎉 Despatch FGH</div>
                <div id="statTotalFgh" class="stat-value">...</div>
                <span id="tagBulanFgh" class="stat-month-tag">-</span>
            </div>
        </div>
        
        <div class="card-search">
            <div class="search-group">
                <div class="input-wrapper">
                    <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    <input type="text" id="inputLot" inputmode="numeric" pattern="[0-9]*" placeholder="Masukkan Nomor Lot..." onkeyup="handleInput(event)">
                    <svg class="clear-icon" id="clearBtn" onclick="resetPencarian()" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </div>
                <button onclick="lakukanPencarian()" class="btn-search">Cari Data</button>
            </div>
            <div id="statusArea" class="status-area"></div>
        </div>

        <div id="alertOverdue" class="alert-overdue-inline">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            <span>OVERDUE</span>
        </div>

        <div id="timelineWrapper" class="timeline-container">
            <div id="timelineBody" class="timeline-list">
            </div>
        </div>
        
        <div id="informasiTambahan" class="alert-despatch">ORDER SUDAH DI DESPATCH</div>
    </div>

    <!-- PANEL POP-UP WINDOW SELEKTOR BULAN -->
    <div id="modalFilter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">📆 Saring Riwayat Laporan</div>
            <div class="month-selector-grid">
                <button id="m1" class="btn-month-node" onclick="pilihBulanNode(1, 'Jan')">Jan</button>
                <button id="m2" class="btn-month-node" onclick="pilihBulanNode(2, 'Feb')">Feb</button>
                <button id="m3" class="btn-month-node" onclick="pilihBulanNode(3, 'Mar')">Mar</button>
                <button id="m4" class="btn-month-node" onclick="pilihBulanNode(4, 'Apr')">Apr</button>
                <button id="m5" class="btn-month-node" onclick="pilihBulanNode(5, 'Mei')">Mei</button>
                <button id="m6" class="btn-month-node" onclick="pilihBulanNode(6, 'Jun')">Jun</button>
                <button id="m7" class="btn-month-node" onclick="pilihBulanNode(7, 'Jul')">Jul</button>
                <button id="m8" class="btn-month-node" onclick="pilihBulanNode(8, 'Agu')">Agst</button>
                <button id="m9" class="btn-month-node" onclick="pilihBulanNode(9, 'Sep')">Sept</button>
                <button id="m10" class="btn-month-node" onclick="pilihBulanNode(10, 'Okt')">Okt</button>
                <button id="m11" class="btn-month-node" onclick="pilihBulanNode(11, 'Nov')">Nov</button>
                <button id="m12" class="btn-month-node" onclick="pilihBulanNode(12, 'Des')">Des</button>
            </div>
            <div class="modal-footer">
                <button class="btn-modal-close" onclick="tutupModalFilter()">Batal</button>
            </div>
        </div>
    </div>

    <script>
// 🔗 KUNCI TOTAL: Memaksa tahun dikunci mati pada angka 2026 agar klop dengan database Neon hasil indexer Anda
// Ganti baris awal inisialisasi variabel di dalam tag <script> Bagian 4 Anda dengan 3 baris pintar ini:
let BULAN_AKTIF = new Date().getMonth() + 1; // Otomatis mendeteksi bulan berjalan harian
let TAHUN_AKTIF = 2026; // Mengunci tahun ke 2026 secara mutlak agar klop dengan database Neon hasil indexer Anda!
let NAMA_BULAN_TEKS = ["", "Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];


document.addEventListener("DOMContentLoaded", function() {
    document.getElementById('tagBulanOrder').innerText = NAMA_BULAN_TEKS[BULAN_AKTIF];
    document.getElementById('tagBulanFgh').innerText = NAMA_BULAN_TEKS[BULAN_AKTIF];
    muatDataDashboard();
});

function muatDataDashboard() {
    fetch(`/api/statistik?bulan=${BULAN_AKTIF}&tahun=${TAHUN_AKTIF}`)
        .then(response => {
            if (!response.ok) throw new Error("Gagal mengambil data");
            return response.json();
        })
        .then(data => {
            document.getElementById('statTotalOrder').innerText = data.total_order !== undefined ? data.total_order : "0";
            document.getElementById('statTotalOverdue').innerText = data.total_overdue !== undefined ? data.total_overdue : "0";
            document.getElementById('statTotalFgh').innerText = data.total_fgh !== undefined ? data.total_fgh : "0";
        })
        .catch(err => {
            console.error("Gagal memuat statistik harian:", err);
            document.getElementById('statTotalOrder').innerText = "0";
            document.getElementById('statTotalOverdue').innerText = "0";
            document.getElementById('statTotalFgh').innerText = "0";
        });
}

function bukaModalFilter() {
    document.getElementById('modalFilter').style.display = "flex";
    for(let i=1; i<=12; i++) {
        document.getElementById(`m${i}`).className = "btn-month-node";
    }
    document.getElementById(`m${BULAN_AKTIF}`).className = "btn-month-node active";
}

function tutupModalFilter() {
    document.getElementById('modalFilter').style.display = "none";
}

function pilihBulanNode(angkaBulan, teksBulan) {
    BULAN_AKTIF = angkaBulan;
    document.getElementById('tagBulanOrder').innerText = NAMA_BULAN_TEKS[angkaBulan];
    document.getElementById('tagBulanFgh').innerText = NAMA_BULAN_TEKS[angkaBulan];
    
    document.getElementById('statTotalOrder').innerText = "...";
    document.getElementById('statTotalFgh').innerText = "...";
    
    tutupModalFilter();
    muatDataDashboard();
}

function handleInput(event) {
    const input = document.getElementById('inputLot');
    const clearBtn = document.getElementById('clearBtn');
    clearBtn.style.display = input.value.length > 0 ? "block" : "none";
    if (event.key === "Enter") { lakukanPencarian(); }
}

function resetPencarian() {
    document.getElementById('inputLot').value = "";
    document.getElementById('clearBtn').style.display = "none";
    document.getElementById('timelineWrapper').style.display = "none";
    document.getElementById('statusArea').style.display = "none";
    document.getElementById('timelineBody').className = "timeline-list";
    document.getElementById('inputLot').focus();
}
function parseIntoDate(str) {
    if (!str || str === "-") return { tgl: "-", jam: "-" };
    const parts = str.split(' ');
    // Antisipasi memotong format string tanggal mentah database
    let tglMentah = parts[0];
    let jamMentah = parts[1] ? parts[1].substring(0, 5) : "00:00";
    
    // Jika database mengembalikan format YYYY-MM-DD, kita balik menjadi DD-MM-YYYY agar rapi
    if (tglMentah.includes('-') && tglMentah.indexOf('-') === 4) {
        const subParts = tglMentah.split('-');
        tglMentah = `${subParts[2]}-${subParts[1]}-${subParts[0]}`;
    }
    return {
        tgl: tglMentah,
        jam: jamMentah + " WIB"
    };
}

function ambilNamaFolder(filePath) {
    if (!filePath) return "-";
    const bagian = filePath.split('\\');
    if (bagian.length > 1) { return bagian[bagian.length - 2]; }
    return filePath;
}

function lakukanPencarian() {
    const query = document.getElementById('inputLot').value.trim();
    const statusArea = document.getElementById('statusArea');
    const timelineBody = document.getElementById('timelineBody');
    const timelineWrapper = document.getElementById('timelineWrapper');
    const infoTambahan = document.getElementById('informasiTambahan');
    const alertOverdue = document.getElementById('alertOverdue');
    
    if(!query) { alert("Mohon masukkan Nomor Lot terlebih dahulu!"); return; }
    
    if (document.activeElement) {
        document.activeElement.blur();
    }
    
    statusArea.style.display = "block";
    statusArea.className = "status-area text-blue";
    statusArea.innerText = "🔄 Menyisir data riwayat lot ke server cloud...";
    
    timelineWrapper.style.display = "block";
    timelineBody.className = "timeline-list"; 
    timelineBody.innerHTML = `<div style="padding: 15px 0;"><div class="shimmer-line"></div><div class="shimmer-line" style="width: 70%;"></div></div>`;
    infoTambahan.style.display = "none";
    alertOverdue.style.display = "none";

    fetch(`/api/cari?lot=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            timelineBody.innerHTML = "";
            if(data.length === 0) {
                statusArea.className = "status-area text-red";
                statusArea.innerText = "❌ Pencarian Selesai! Data riwayat order tidak ditemukan.";
                timelineWrapper.style.display = "none";
                return;
            }
            
            statusArea.className = "status-area text-green";
            statusArea.innerHTML = `✅ Pelacakan Selesai! Berhasil menemukan <b>${data.length}</b> titik riwayat dokumen.`;
            timelineWrapper.style.display = "block";
            timelineBody.className = "timeline-list has-data";

            let ditemukanFGH = false;
            let ditemukanOverdueTemplate = false;
            let teksKolomN = "";
            
            data.forEach(row => { if (row.keterangan_n && row.keterangan_n !== "") { teksKolomN = row.keterangan_n; } });

            data.forEach((row, index) => {
                if (row.nama_file.toUpperCase().includes('FGH')) { ditemukanFGH = true; }
                if (row.nama_file.toUpperCase().includes('OVERDUE TEMPLATE')) {
                    ditemukanOverdueTemplate = true;
                }

                const namaFolder = ambilNamaFolder(row.file_path);
                const nfUpper = namaFolder.toUpperCase();
                
                const waktuObj = parseIntoDate(row.tanggal_input);

                let labelTambahan = "";
                if ((nfUpper.includes("APP") || nfUpper.includes("REPORT INTEGRASI MO") || nfUpper.includes("MOBILE")) && teksKolomN !== "") {
                    labelTambahan = `<span class="badge-keterangan-n">${teksKolomN}</span>`;
                }

                let teksStatus = namaFolder.toUpperCase(); 
                let classKustom = "timeline-item";
                
                if (nfUpper.includes("DTH 2026")) {
                    teksStatus = "DTH";
                } else if (nfUpper.includes("REPORT INTEGRASI MO") || nfUpper.includes("MOBILE")) {
                    teksStatus = "MOBILE";
                } else if (nfUpper.includes("APP")) {
                    teksStatus = "APPAREL";
                } else if (nfUpper.includes("OVERDUE")) {
                    teksStatus = "OVERDUE";
                } else if (nfUpper.includes("FGH")) {
                    teksStatus = "DELIVERED / RECEIVED";
                    classKustom = "timeline-item is-fgh";
                }

                const divItem = document.createElement('div');
                divItem.className = classKustom;
                divItem.innerHTML = `
                    <div class="timeline-time">
                        <div class="date-bold">${waktuObj.tgl}</div>
                        <div>${waktuObj.jam}</div>
                    </div>
                    <div class="timeline-badge-wrapper">
                        <div class="timeline-badge"></div>
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-title">
                            <span style="color: #003399; font-weight: 800; letter-spacing: 0.3px;">${teksStatus}</span> 
                            ${labelTambahan}
                        </div>
                        <div class="timeline-meta">
                            <div><span class="meta-label">Sheet:</span><span class="meta-val"><span class="badge-sheet">${row.nama_sheet}</span></span></div>
                            <div><span class="meta-label">No Lot:</span><span class="meta-val font-mono">${row.no_lot}</span></div>
                        </div>
                        <div>
                            <button onclick="unduhFile('${row.file_path.replace(/\\/g, '\\\\')}')" class="btn-action-view">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                <span>Buka Dokumen Laporan</span>
                            </button>
                        </div>
                    </div>`;
                timelineBody.appendChild(divItem);
            });
            if (ditemukanFGH) { infoTambahan.style.display = "block"; }
            if (ditemukanOverdueTemplate) { alertOverdue.style.display = "flex"; }
            muatDataDashboard();
        })
        .catch(err => console.error("Gagal memproses pencarian:", err));
}
function unduhFile(filePath) {
    fetch('/api/buka', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: filePath }) })
    .then(response => { if (!response.ok) throw new Error(); return response.blob(); })
    .then(blob => {
        const url = window.URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filePath.split('\\').pop();
        document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(err => alert("Gagal mengunduh file berkas Excel asli."));
}
</script>
