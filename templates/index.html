<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker No Lot - Finishing Department</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); min-height: 100vh; color: #1e293b; padding: 40px 16px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        
        .header { text-align: center; padding: 10px 0; margin-bottom: 4px; }
        .header h1 { font-size: 28px; font-weight: 800; color: #003399; letter-spacing: -0.5px; line-height: 1.2; text-transform: uppercase; margin-bottom: 6px; }
        .header p { color: #64748b; font-size: 14.5px; font-weight: 500; }
        
        .card-search { background: #ffffff; border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px -5px rgba(0, 51, 153, 0.05); border: 1px solid #e2e8f0; }
        .search-group { display: flex; gap: 12px; position: relative; }
        .input-wrapper { flex-grow: 1; position: relative; }
        .input-wrapper input { width: 100%; padding: 16px 48px 16px 48px; border: 1.5px solid #cbd5e1; border-radius: 14px; font-size: 16px; background: #f8fafc; font-weight: 500; transition: all 0.25s; -webkit-appearance: none; appearance: none; }
        .input-wrapper input:focus { outline: none; border-color: #003399; background: #fff; box-shadow: 0 0 0 4px rgba(0, 51, 153, 0.1); }
        .input-wrapper .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #94a3b8; }
        .clear-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #94a3b8; cursor: pointer; display: none; }
        .clear-icon:hover { color: #64748b; }
        
        .btn-search { background: #003399; color: #fff; border: none; padding: 0 32px; font-size: 15px; font-weight: 600; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(0, 51, 153, 0.15); }
        .btn-search:hover { background: #002277; transform: translateY(-1px); }
        
        .status-area { margin-top: 14px; font-size: 14px; font-weight: 600; display: none; }
        .text-blue { color: #003399; } .text-green { color: #16a34a; } .text-red { color: #dc2626; }
        
        .alert-overdue-inline { background: #fff1f2; border: 1px solid #fecdd3; border-top: 4px solid #e11d48; color: #9f1239; padding: 14px 20px; border-radius: 14px; font-weight: 800; font-size: 15px; display: none; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
        .alert-overdue-inline svg { width: 18px; height: 18px; color: #e11d48; }
        .alert-despatch { background: #f0fdf4; border: 1px solid #bbf7d0; border-top: 4px solid #16a34a; color: #166534; padding: 18px; border-radius: 14px; font-weight: 800; font-size: 16px; text-align: center; letter-spacing: 1px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); display: none; }

        /* ─── STRUKTUR LINIMASA GAYA DHL ─── */
        .timeline-container { background: #ffffff; border-radius: 20px; padding: 32px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); display: none; position: relative; }
        .timeline-list { position: relative; list-style: none; padding-left: 0; }
        .timeline-list.has-data::before { content: ''; position: absolute; left: 160px; top: 15px; height: calc(100% - 30px); width: 2px; background: #cbd5e1; }
        
        .timeline-item { display: flex; margin-bottom: 24px; position: relative; }
        .timeline-item:last-child { margin-bottom: 0; }
        
        .timeline-time { width: 140px; text-align: right; font-size: 13.5px; color: #64748b; font-weight: 500; padding-top: 2px; padding-right: 10px; flex-shrink: 0; }
        .timeline-time .date-bold { font-size: 14px; color: #1e293b; font-weight: 700; margin-bottom: 2px; }
        
        .timeline-badge-wrapper { width: 42px; display: flex; justify-content: center; position: relative; flex-shrink: 0; }
        .timeline-badge { width: 16px; height: 16px; border-radius: 50%; background: #ffffff; border: 3px solid #94a3b8; z-index: 2; margin-top: 4px; box-shadow: 0 0 0 4px #ffffff; }
        
        .timeline-item.is-fgh .timeline-badge { width: 22px; height: 22px; background: #16a34a; border: 4px solid #ffffff; box-shadow: 0 0 0 3px #16a34a; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
        .timeline-item.is-fgh .timeline-badge::after { content: '✓'; color: #ffffff; font-size: 11px; font-weight: 900; }
        
        .timeline-content { flex-grow: 1; padding-left: 14px; padding-top: 1px; }
        .timeline-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .timeline-meta { font-size: 13px; color: #64748b; font-weight: 500; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .badge-sheet { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }
        .badge-keterangan-n { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 700; }
        .font-mono { font-family: monospace; font-size: 13.5px; color: #475569; font-weight: 600; }
        
        .btn-action-view { background: transparent; color: #003399; border: none; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 2px 0; transition: color 0.2s; margin-top: 4px; }
        .btn-action-view:hover { color: #001155; text-decoration: underline; }
        .btn-action-view svg { width: 14px; height: 14px; }

                @media (max-width: 640px) {
            body { padding: 20px 12px; }
            .header h1 { font-size: 22px; }
            .search-group { flex-direction: column; gap: 12px; }
            .btn-search { width: 100%; padding: 15px 0; font-size: 15px; }
            .timeline-container { padding: 20px 12px; }
            .timeline-list::before { left: 75px; }
            .timeline-time { width: 65px; text-align: left; font-size: 11.5px; padding-right: 0; }
            .timeline-time .date-bold { font-size: 12.5px; }
            .timeline-badge-wrapper { width: 24px; }
            .timeline-content { padding-left: 6px; }
            .timeline-title { font-size: 13.5px; }
            .timeline-meta { font-size: 12px; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tracker No Lot Departmen Finishing</h1>
            <p>Cari dan lacak order berdasarkan Nomor Lot secara instan.</p>
        </div>
        
        <div class="card-search">
            <div class="search-group">
                <div class="input-wrapper">
                    <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    <input type="text" id="inputLot" inputmode="numeric" pattern="[0-9]*" placeholder="Masukkan Nomor Lot..." onkeyup="handleInput(event)">
                    <svg class="clear-icon" id="clearBtn" onclick="resetPencarian()" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </div>
                <button onclick="lakukanPencarian()" class="btn-search">Cari Data</button>
            </div>
            <div id="statusArea" class="status-area"></div>
        </div>

        <div id="alertOverdue" class="alert-overdue-inline">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            <span>OVERDUE</span>
        </div>

        <div id="timelineWrapper" class="timeline-container">
            <div id="timelineBody" class="timeline-list">
            </div>
        </div>
        
        <div id="informasiTambahan" class="alert-despatch">ORDER SUDAH DI DESPATCH</div>
    </div>

    <script>
function handleInput(event) {
    const input = document.getElementById('inputLot');
    const clearBtn = document.getElementById('clearBtn');
    clearBtn.style.display = input.value.length > 0 ? "block" : "none";
    if (event.key === "Enter") { lakukanPencarian(); }
}

function resetPencarian() {
    document.getElementById('inputLot').value = "";
    document.getElementById('clearBtn').style.display = "none";
    document.getElementById('timelineWrapper').style.display = "none";
    document.getElementById('statusArea').style.display = "none";
    document.getElementById('timelineBody').className = "timeline-list";
    document.getElementById('inputLot').focus();
}

function ambilNamaFolder(filePath) {
    if (!filePath) return "-";
    const bagian = filePath.split('\\');
    if (bagian.length > 1) { return bagian[bagian.length - 2]; }
    return filePath;
}

function lakukanPencarian() {
    const query = document.getElementById('inputLot').value.trim();
    const statusArea = document.getElementById('statusArea');
    const timelineBody = document.getElementById('timelineBody');
    const timelineWrapper = document.getElementById('timelineWrapper');
    const infoTambahan = document.getElementById('informasiTambahan');
    const alertOverdue = document.getElementById('alertOverdue');
    
    if(!query) { alert("Mohon masukkan Nomor Lot terlebih dahulu!"); return; }
    
    if (document.activeElement) {
        document.activeElement.blur();
    }
    
    statusArea.style.display = "block";
    statusArea.className = "status-area text-blue";
    statusArea.innerText = "🔄 Menyisir data riwayat lot ke server cloud...";
    
    timelineWrapper.style.display = "block";
    timelineBody.className = "timeline-list"; 
    timelineBody.innerHTML = `<div style="padding: 20px 0;"><div class="shimmer-line"></div><div class="shimmer-line" style="width: 70%;"></div></div>`;
    infoTambahan.style.display = "none";
    alertOverdue.style.display = "none";

    fetch(`/api/cari?lot=${encodeURIComponent(query)}`)
        .then(response => response.json())
        .then(data => {
            timelineBody.innerHTML = "";
            if(data.length === 0) {
                statusArea.className = "status-area text-red";
                statusArea.innerText = "❌ Pencarian Selesai! Data riwayat order tidak ditemukan.";
                timelineWrapper.style.display = "none";
                return;
            }
            
            statusArea.className = "status-area text-green";
            statusArea.innerHTML = `✅ Pelacakan Selesai! Berhasil menemukan <b>${data.length}</b> titik riwayat dokumen.`;
            timelineWrapper.style.display = "block";
            timelineBody.className = "timeline-list has-data";

            let ditemukanFGH = false;
            let ditemukanOverdueTemplate = false;
            let teksKolomN = "";
            
            data.forEach(row => { if (row.keterangan_n && row.keterangan_n !== "") { teksKolomN = row.keterangan_n; } });

            data.forEach((row, index) => {
                if (row.nama_file.toUpperCase().includes('FGH')) { ditemukanFGH = true; }
                if (row.nama_file.toUpperCase().includes('OVERDUE TEMPLATE')) { ditemukanOverdueTemplate = true; }

                const namaFolder = ambilNamaFolder(row.file_path);
                const nfUpper = namaFolder.toUpperCase();
                
                let stringTgl = "-";
                let stringJam = "-";
                if (row.tanggal_input && row.tanggal_input !== "-") {
                    const bagianWaktu = row.tanggal_input.split(' ');
                    stringTgl = bagianWaktu[0];
                    stringJam = bagianWaktu[1] ? bagianWaktu[1] + " WIB" : "-";
                }

                // 🔗 KUNCI LOGIKA UTAMA: Pasang lencana Kolom N baik di MOBILE maupun di APPAREL
                let labelTambahan = "";
                if ((nfUpper.includes("APP") || nfUpper.includes("REPORT INTEGRASI MO") || nfUpper.includes("MOBILE")) && teksKolomN !== "") {
                    labelTambahan = `<span class="badge-keterangan-n">${teksKolomN}</span>`;
                }

                let teksStatus = namaFolder.toUpperCase(); 
                let classKustom = "timeline-item";
                
                if (nfUpper.includes("DTH 2026")) {
                    teksStatus = "DTH";
                } else if (nfUpper.includes("REPORT INTEGRASI MO") || nfUpper.includes("MOBILE")) {
                    teksStatus = "MOBILE";
                } else if (nfUpper.includes("APP")) {
                    teksStatus = "APPAREL";
                } else if (nfUpper.includes("OVERDUE")) {
                    teksStatus = "OVERDUE";
                } else if (nfUpper.includes("FGH")) {
                    teksStatus = "DELIVERED / RECEIVED";
                    classKustom = "timeline-item is-fgh";
                }

                const divItem = document.createElement('div');
                divItem.className = classKustom;
                divItem.innerHTML = `
                    <div class="timeline-time">
                        <div class="date-bold">${stringTgl}</div>
                        <div>${stringJam}</div>
                    </div>
                    <div class="timeline-badge-wrapper">
                        <div class="timeline-badge"></div>
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-title">
                            <span style="color: #003399; font-weight: 800; letter-spacing: 0.3px;">${teksStatus}</span> 
                            ${labelTambahan}
                        </div>
                        <div class="timeline-meta">
                            <span>Folder: <b>${namaFolder}</b></span> •
                            <span>Sheet: <span class="badge-sheet">${row.nama_sheet}</span></span> •
                            <span>No Lot: <span class="font-mono">${row.no_lot}</span></span>
                        </div>
                        <div>
                            <button onclick="unduhFile('${row.file_path.replace(/\\/g, '\\\\')}')" class="btn-action-view">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                <span>Buka Dokumen Laporan</span>
                            </button>
                        </div>
                    </div>`;
                timelineBody.appendChild(divItem);
            });
            if (ditemukanFGH) { infoTambahan.style.display = "block"; }
            if (ditemukanOverdueTemplate) { alertOverdue.style.display = "flex"; }
        })
        .catch(err => {
            statusArea.className = "status-area text-red";
            statusArea.innerText = "⚠️ Terjadi kegagalan komunikasi dengan database cloud.";
            timelineWrapper.style.display = "none";
        });
}
function unduhFile(filePath) {
    fetch('/api/buka', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path: filePath }) })
    .then(response => { if (!response.ok) throw new Error(); return response.blob(); })
    .then(blob => {
        const url = window.URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filePath.split('\\').pop();
        document.body.appendChild(a); a.click(); a.remove();
    })
    .catch(err => alert("Gagal mengunduh file berkas Excel asli."));
}
</script>
</body>
</html>
